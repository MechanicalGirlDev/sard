[package]
name = "sard-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
gpu-physics = ["sard/gpu-physics"]

[dependencies]
sard = { path = "..", default-features = false, features = ["physics"] }
hecs = "0.11.1"
anyhow = "1.0.104"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
iai-callgrind = "0.16.1"

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "physics_iai"
harness = false
